name: Auto Deploy to Vikasdhara Foundation Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build

      - name: 🚀 Sync & Deploy to Hostinger Root (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '82.180.143.14' }}
          username: ${{ secrets.FTP_USERNAME || 'u696371114.Vikasdhara' }}
          password: ${{ secrets.FTP_PASSWORD || 'Vortex@121' }}
          server-dir: './'
          local-dir: './dist/'
          dangerous-clean-slate: false

      - name: 🚀 Sync & Deploy to Domains public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '82.180.143.14' }}
          username: ${{ secrets.FTP_USERNAME || 'u696371114.Vikasdhara' }}
          password: ${{ secrets.FTP_PASSWORD || 'Vortex@121' }}
          server-dir: 'domains/vikasdharafoundation.org/public_html/'
          local-dir: './dist/'
          dangerous-clean-slate: false
