name: Auto Deploy to Vikasdhara Foundation Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build

      - name: 🚀 Deploy to Hostinger FTP (Webroot)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || '82.180.143.14' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'u696371114.Vikasdhara' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || 'Vortex@121' }}
        run: node scripts/ftp_deploy.cjs



